[project]
name = "fiti"
version = "0.1.0"
description = "FastAPI Application with SQLAlchemy and Clean Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "pydantic[email]>=2.6.4",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.1",
    "firebase-admin>=7.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
